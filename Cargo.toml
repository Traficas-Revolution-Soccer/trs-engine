[workspace]
members = ["crates/trs-engine"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.97.1"

[workspace.dependencies]
bevy = { version = "0.20.1", features = ["3d", "x11"] }
bevy_rapier3d = { version = "0.37.0", default-features = false, features = ["dim3"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
